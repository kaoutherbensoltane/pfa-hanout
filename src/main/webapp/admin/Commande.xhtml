<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">

<h:head></h:head>
<body>
	<h:form id="f1">
		<p:commandButton value="+" onclick="PF('dlg').show();">
		</p:commandButton>




		<p:dataTable id="tab" value="#{commandeBean.list}" var="cmd">

			<p:column headerText="Article">

				<h:outputText value="#{cmd.produit.article}" />
			</p:column>


			<p:column headerText="cin_cmd">
				<h:outputText value="#{cmd.cinCmd}" />
			</p:column>


			<p:column headerText="num_cmd">
				<h:outputText value="#{cmd.numCmd}" />
			</p:column>


			<p:column headerText="date_cmd">
				<h:outputText value="#{cmd.dateCmd}" />
			</p:column>







			<p:column headerText="opération" width="20%">
				<p:commandButton value="supprimer" update="tab"
					action="#{commandeBean.supprimer()}">


					<f:setPropertyActionListener value="#{cmd}"
						target="#{commandeBean.commande}" />
					<p:confirm header="Confirmation" message="Are you sure?"
						icon="pi pi-exclamation-triangle" />
				</p:commandButton>


				<p:commandButton value="Editer" action="#{commandeBean.clickEdit()}"
					onclick="PF('dlg').show()" update="f1:panel">
					<f:setPropertyActionListener value="#{cmd}"
						target="#{commandeBean.commande}" />
				</p:commandButton>
			</p:column>
		</p:dataTable>











		<p:dialog header="Commabde" widgetVar="dlg" showEffect="explode"
			hideEffect="bounce" modal="true" resizable="false" draggable="false">

			<h:panelGrid id="panel" columns="2">


				<h:outputText value="Produit" />
				<p:selectOneMenu value="#{commandeBean.commande.produit.article}"
					filter="true" filterMatchMode="contains">

					<f:selectItems value="#{produitBean.list}" var="cmd"
						itemLabel="#{cmd.article}" itemValue="#{cmd.article}" />
				</p:selectOneMenu>








				<h:outputText value="cin_cmd" />
				<p:inputText value="#{commandeBean.commande.cinCmd}"></p:inputText>


				<h:outputText value="num_cmd" />
				<p:inputText value="#{commandeBean.commande.numCmd}"></p:inputText>



				<h:outputText value="Date" />

				<p:calendar value="#{commandeBean.commande.dateCmd}"
					pattern="dd/MM/yyyy"></p:calendar>




		


				<p:commandButton action="#{commandeBean.ajouter()}" value="Ajouter"
					rendered="#{commandeBean.bntAdd}" update="tab"
					oncomplete="PF('dlg').hide()" />
				<p:commandButton action="#{commandeBean.modifier()}" value="Modifier"
					rendered="#{commandeBean.btnEdit}" update="tab"
					oncomplete="PF('dlg').hide()" />
				<p:commandButton action="#{commandeBean.annuler()}" value="Annuler"  update="f1:panel"
                 oncomplete="PF('dlg').hide()"/>




			</h:panelGrid>



		</p:dialog>



		<p:growl id="growl" showDetail="true" life="5000">
			<p:autoUpdate></p:autoUpdate>
		</p:growl>


		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="oui" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
	</h:form>
</body>
</html>
