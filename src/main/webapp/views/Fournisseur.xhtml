<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">

<h:head></h:head>

<ui:composition template="../facelets/template.xhtml">

<ui:define name="content">
<body>
<h:form id="f1">
		<p:commandButton value="+" onclick="PF('dlg').show();">
		</p:commandButton>




		<p:dataTable id="tab" value="#{fournisseurBean.list}" var="fsr">
			<p:column headerText="CIN">
				<h:outputText value="#{fsr.cinFsr}" />
			</p:column>

			<p:column headerText="Nom">
				<h:outputText value="#{fsr.nomFsr}" />
			</p:column>


			<p:column headerText="Prenom">
				<h:outputText value="#{fsr.prenomFsr}" />
			</p:column>



			<p:column headerText="Adresse">
				<h:outputText value="#{fsr.adresseFsr}" />
			</p:column>


			<p:column headerText="Email">
				<h:outputText value="#{fsr.mailFsr}" />
			</p:column>

			<p:column headerText="opération" width="20%">
				<p:commandButton value="supprimer" update="tab"
				
					action="#{fournisseurBean.supprimer()}">
				
					
					<f:setPropertyActionListener value="#{fsr}"
						target="#{fournisseurBean.fournisseur}" />
						<p:confirm header="Confirmation" message="Are you sure?" icon="pi pi-exclamation-triangle" />
				</p:commandButton>
				
				
				<p:commandButton value="Editer" action="#{fournisseurBean.clickEdit()}" onclick="PF('dlg').show()" update="f1:panel">
				<f:setPropertyActionListener value="#{fsr}" target="#{fournisseurBean.fournisseur}" />     </p:commandButton>
			</p:column>
		</p:dataTable>


		<p:dialog header="Fournisseur" widgetVar="dlg"
			showEffect="explode" hideEffect="bounce" modal="false"
			resizable="false" >

			<h:panelGrid   id="panel"  columns="2">
				<h:outputText value="CIN" />
				<p:inputText value="#{fournisseurBean.fournisseur.cinFsr}"
					readonly="#{fournisseurBean.btnEdit}"></p:inputText>

				<h:outputText value="NOM" />
				<p:inputText value="#{fournisseurBean.fournisseur.nomFsr}"></p:inputText>
				<h:outputText value="Prénom" />
				<p:inputText value="#{fournisseurBean.fournisseur.prenomFsr}"></p:inputText>

				<h:outputText value="EMAIL" />
				<p:inputText value="#{fournisseurBean.fournisseur.mailFsr}"></p:inputText>


				<h:outputText value="ADRESSE" />
				<p:inputText value="#{fournisseurBean.fournisseur.adresseFsr}"></p:inputText>
				<p:commandButton action="#{fournisseurBean.ajouter()}" value="Ajouter"
					rendered="#{fournisseurBean.bntAdd}" update="tab"
					oncomplete="PF('dlg').hide()" />
				<p:commandButton action="#{fournisseurBean.modifier()}"
					value="Modifier" rendered="#{fournisseurBean.btnEdit}"    update="tab"
					oncomplete="PF('dlg').hide()" />  
				<p:commandButton action="#{fournisseurBean.annuler()}" value="Annuler"  update="f1:panel"  oncomplete="PF('dlg').hide()"/>

			</h:panelGrid>



		</p:dialog>
		<p:growl id="growl" showDetail="true" life="5000">
			<p:autoUpdate></p:autoUpdate>
		</p:growl>


		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="oui" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
	</h:form>






</body>

</ui:define>
</ui:composition> 

</html>
